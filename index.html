<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Calculator</title>
  <style>
    :root{
      --bg:#f3f4f6; --panel:#222; --button:#fff; --accent:#ff9500;
      --muted:#9aa0a6; --shadow: 0 6px 18px rgba(0,0,0,0.12);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    html,body{height:100%; margin:0; background:linear-gradient(180deg,#e6eef8,#f3f4f6); display:flex; align-items:center; justify-content:center;}
    .calculator{
      width:340px; background:var(--panel); border-radius:16px; padding:18px; box-shadow:var(--shadow); color:#fff;
      display:flex; flex-direction:column; gap:12px;
    }
    .display{
      background:rgba(255,255,255,0.06); padding:12px; border-radius:10px; min-height:64px;
      display:flex; flex-direction:column; justify-content:center; word-break:break-all;
    }
    .expression{ font-size:14px; color:var(--muted); min-height:18px; }
    .result{ font-size:28px; text-align:right; font-weight:600; margin-top:4px; }
    .keys{ display:grid; grid-template-columns: repeat(4,1fr); gap:10px; }
    button.key{
      height:56px; border-radius:10px; border:0; font-size:18px; cursor:pointer;
      background:var(--button); color:#111; box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      transition:transform .06s ease, box-shadow .06s ease;
    }
    button.key:active{ transform:translateY(2px); box-shadow:none; }
    button.op{ background:linear-gradient(180deg,#ffb86b,var(--accent)); color:#fff; }
    button.ctrl{ background:#e8e9ee; color:#111; }
    button.equal{ grid-column: span 2; background:linear-gradient(180deg,#3b82f6,#1e63d6); color:#fff; font-weight:700; }
    @media (max-width:380px){
      .calculator{ width:94vw; padding:14px; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Simple calculator">
    <div class="display" role="region" aria-live="polite">
      <div id="expression" class="expression" aria-hidden="true"></div>
      <div id="result" class="result">0</div>
    </div>

    <div class="keys" role="group" aria-label="Calculator keys">
      <button class="key ctrl" data-action="clear" title="Clear (C)">C</button>
      <button class="key ctrl" data-action="back" title="Backspace">⌫</button>
      <button class="key ctrl" data-action="percent" title="Percent">%</button>
      <button class="key op" data-value="÷" title="Divide">÷</button>

      <button class="key" data-value="7">7</button>
      <button class="key" data-value="8">8</button>
      <button class="key" data-value="9">9</button>
      <button class="key op" data-value="×">×</button>

      <button class="key" data-value="4">4</button>
      <button class="key" data-value="5">5</button>
      <button class="key" data-value="6">6</button>
      <button class="key op" data-value="−">−</button>

      <button class="key" data-value="1">1</button>
      <button class="key" data-value="2">2</button>
      <button class="key" data-value="3">3</button>
      <button class="key op" data-value="+">+</button>

      <button class="key" data-value="0" style="grid-column: span 2; text-align:left; padding-left:24px;">0</button>
      <button class="key" data-value=".">.</button>
      <button class="key equal" data-action="equals" title="Equals">=</button>
    </div>
  </main>

  <script>
    (function(){
      const exprEl = document.getElementById('expression');
      const resultEl = document.getElementById('result');
      let expression = ''; // stores displayed expression with operator symbols (× ÷ −)
      let lastKey = '';    // track last key type: 'num','op','dot','equals'

      const operators = { '×':'*', '÷':'/', '−':'-' };

      function updateDisplay(){
        exprEl.textContent = expression;
        if(!expression) resultEl.textContent = '0';
      }

      function safeEvaluate(raw){
        // convert display operators to JS operators
        let jsExpr = raw.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');
        // prevent starting with operator except minus
        jsExpr = jsExpr.replace(/^[+\/*]/,'');
        try{
          // Use Function instead of eval to be slightly safer
          const val = Function('"use strict"; return (' + jsExpr + ')')();
          if (typeof val === 'number' && isFinite(val)) {
            // trim trailing .0
            return Math.round((val + Number.EPSILON) * 1e12) / 1e12;
          } else {
            return 'Error';
          }
        }catch(e){
          return 'Error';
        }
      }

      function pressValue(v){
        if (v === '.') {
          // avoid multiple decimals in the same number
          const parts = expression.split(/[\+\−\×\÷]/);
          const last = parts[parts.length - 1];
          if (last.includes('.')) return;
          if (lastKey === 'equals') {
            expression = '0.';
          } else {
            if (!last) expression += '0.';
            else expression += '.';
          }
          lastKey = 'dot';
        } else if (/[0-9]/.test(v)) {
          if (lastKey === 'equals') {
            expression = v;
          } else {
            expression += v;
          }
          lastKey = 'num';
        } else {
          // operator pressed
          if (!expression && v === '−') {
            // allow negative start
            expression = '−';
            lastKey = 'op';
            return;
          }
          // replace last operator if user types two in a row
          if (/[+\−\×\÷]$/.test(expression)) {
            expression = expression.slice(0,-1) + v;
          } else {
            expression += v;
          }
          lastKey = 'op';
        }
        updateDisplay();
      }

      function pressEquals(){
        if (!expression) return;
        const res = safeEvaluate(expression);
        resultEl.textContent = res;
        expression = String(res === 'Error' ? '' : res).replace(/-/g,'−'); // show negative sign as display minus
        lastKey = 'equals';
        exprEl.textContent = ''; // optional: keep result only
      }

      function pressClear(){
        expression = '';
        resultEl.textContent = '0';
        lastKey = '';
        updateDisplay();
      }

      function pressBack(){
        if (lastKey === 'equals') { pressClear(); return; }
        expression = expression.slice(0,-1);
        updateDisplay();
      }

      // Handle percent as immediate operation on last number: convert "50%" -> "0.5"
      function pressPercent(){
        // find last number
        const match = expression.match(/([0-9]*\.?[0-9]+)$|([−][0-9]*\.?[0-9]+)$/);
        if (!match) return;
        const num = match[0].replace('−','-');
        const percentVal = String(Number(num) / 100);
        expression = expression.slice(0, match.index) + percentVal.replace(/-/,'−');
        updateDisplay();
      }

      document.querySelectorAll('.key').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const val = btn.getAttribute('data-value');
          const action = btn.getAttribute('data-action');
          if (action === 'clear') pressClear();
          else if (action === 'back') pressBack();
          else if (action === 'equals') pressEquals();
          else if (action === 'percent') pressPercent();
          else if (val) pressValue(val);
        });
      });

      // keyboard support
      window.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') { pressValue(e.key); e.preventDefault(); return; }
        if (e.key === '.' || e.key === ',') { pressValue('.'); e.preventDefault(); return; }
        if (e.key === '/' || e.key === '*') pressValue(e.key === '/' ? '÷' : '×');
        if (e.key === '-' ) pressValue('−');
        if (e.key === '+' ) pressValue('+');
        if (e.key === 'Enter' || e.key === '=') { pressEquals(); e.preventDefault(); return; }
        if (e.key === 'Backspace') { pressBack(); e.preventDefault(); return; }
        if (e.key.toLowerCase() === 'c') { pressClear(); return; }
        if (e.key === '%') { pressPercent(); return; }
      });

      // live small preview calculation while typing (optional)
      const livePreview = () => {
        if (!expression || lastKey === 'equals') return;
        const res = safeEvaluate(expression);
        resultEl.textContent = (res === 'Error') ? '…' : res;
      };
      // update preview on each change
      const observer = new MutationObserver(livePreview);
      observer.observe(exprEl, { childList: true, characterData: true, subtree: true });

      // initial render
      updateDisplay();
    })();
  </script>
</body>
</html>
